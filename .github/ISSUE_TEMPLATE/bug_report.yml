name: Bug report
description: Help improve the n0tch developer preview.
body:
  - type: input
    id: version
    attributes:
      label: n0tch version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the expected and actual behavior. Remove anything private.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no passwords, access tokens, or screenshots showing private content.
          required: true
